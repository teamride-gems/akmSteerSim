# Fixed-budget training configuration for the five-policy action-interface
# ensemble falsification study.  This is a screening experiment, not the
# confirmatory multi-ensemble study.
policy: MlpPolicy
policy_kwargs:
  net_arch: [64, 64]
torch_num_threads: 1
seed: 0

train_steps: 50000
eval_interval_steps: 25000
save_every_steps: 10000

learning_rate: 3.0e-4
batch_size: 256
buffer_size: 1000000
learning_starts: 1000
tau: 0.005
discount_half_life_seconds: 10.0

ent_coef: auto
target_entropy: auto
train_freq: 4
gradient_steps: 1

train_track: Sakhir
validation_tracks:
  - Austin
  - BrandsHatch
test_tracks:
  - Budapest
  - Hockenheim

n_eval_episodes: 2
report_train_track: false
selection_metric: completion_then_progress
early_stop_patience: null
early_stop_min_delta: 0.0
