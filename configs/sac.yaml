policy: MlpPolicy
seed: 0

train_steps: 500000
eval_interval_steps: 5000
save_every_steps: 25000

learning_rate: 3.0e-4
batch_size: 256
buffer_size: 1000000
learning_starts: 1000
tau: 0.005
gamma: 0.99

ent_coef: auto
target_entropy: auto

train_track: Sakhir
validation_tracks:
  - Austin
  - BrandsHatch
test_tracks:
  - Budapest
  - Hockenheim

n_eval_episodes: 10

selection_metric: completion_then_progress
early_stop_patience: 10
early_stop_min_delta: 0.0