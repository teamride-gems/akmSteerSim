# ============================================================
# Vehicle and environment configuration
# ============================================================

action_space: steer_speed  # options: steer_speed, curvature_speed, lookahead_point, bezier

max_episode_steps: 3000

# --- speed and steering limits ---
# v_min > 0 prevents zero-speed degeneracies (undefined Ackermann
# geometry, trivial crash-avoidance by stopping).
v_min: 0.5
v_max: 6.0
delta_max: 0.4189  # 24.0 degrees

# --- rate limits ---
# Applied in apply_ackermann_command_constraints(). Without these,
# the steer_speed agent can command arbitrarily fast steering/speed
# changes, which is physically unrealistic and makes smoothness
# comparisons against kinematically-constrained action spaces unfair.
# Values are typical for F1TENTH hardware.
vehicle:
  wheelbase: 0.33
  max_steer_rad: 0.4189
  max_speed_mps: 6.0
  min_speed_mps: 0.5
  max_steering_rate: 3.5   # rad/s — constrains steering changes per timestep
  max_acceleration: 8.0    # m/s^2 — constrains speed changes per timestep

# --- lidar ---
lidar:
  sectors: 21
  fov_deg: 270
  clip_max_m: 10.0
  clip_min_m: 0.05
  outlier_quantile: 0.995

# --- simulator ---
sim:
  map_dir: assets/f1tenth_racetracks/Sakhir
  map_name: Sakhir_map

# --- reward ---
# Reward is action-space-agnostic: no steering-related terms.
# Smoothness should emerge as a measured outcome, not be optimized.
reward:
  w_progress: 1.0
  w_a_long: -0.1
  w_a_lat: -0.1
  w_time: -0.01
  crash_penalty: -10.0
  ref_a_long: 5.0   # m/s^2 — normalization scale for longitudinal accel penalty
  ref_a_lat: 8.0    # m/s^2 — normalization scale for lateral accel penalty