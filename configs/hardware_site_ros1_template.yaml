site_id: REPLACE_WITH_SITE_ID
robot_id: frank
course_id: REPLACE_WITH_COURSE_ID
operator: REPLACE_WITH_OPERATOR
safety_supervisor: REPLACE_WITH_SUPERVISOR
ros_domain_id: 0  # retained only for compatibility with the frozen capture utility

platform:
  computer: nvidia_agx_xavier
  ubuntu_version: "20.04"
  ros_version: 1
  ros_distro: noetic
  python_major: 3

topics:
  drive: /vesc/high_level/ackermann_cmd_mux/input/nav_0
  # Frank's wheel odometry supplies speed and yaw rate. Cartographer TF supplies
  # the fixed-world pose used for trajectory evaluation.
  odometry: /vesc/odom
  localization_tf: /tf
  deadman: /hardware_study/deadman
  estop: /hardware_study/estop
  safety_override: /vesc/low_level/ackermann_cmd_mux/input/safety
  joint_states: null
  battery_state: null
  additional_bag_topics:
    - /scan
    - /laser_status
    - /diagnostics
    - /imu
    - /tf_static
    - /vesc/joy
    - /vesc/sensors/core
    - /vesc/sensors/servo_position_command
    - /vesc/commands/motor/speed
    - /vesc/commands/motor/brake
    - /vesc/commands/motor/current
    - /vesc/commands/motor/duty_cycle
    - /vesc/commands/motor/position
    - /vesc/commands/motor/unsmoothed_speed
    - /vesc/commands/servo/position
    - /vesc/commands/servo/unsmoothed_position
    - /vesc/high_level/ackermann_cmd_mux/output
    - /vesc/high_level/ackermann_cmd_mux/active
    - /vesc/low_level/ackermann_cmd_mux/input/navigation
    - /vesc/low_level/ackermann_cmd_mux/input/safety
    - /vesc/low_level/ackermann_cmd_mux/input/teleop
    - /vesc/low_level/ackermann_cmd_mux/output
    - /vesc/low_level/ackermann_cmd_mux/active

frames:
  command_frame_id: base_link
  odometry_frame_id: cartographer_map
  localization_odom_frame_id: cartographer_odom
  base_frame_id: base_link
  localization_stale_seconds: 0.10

steering_feedback:
  source: derived_from_vesc_odometry_model
  steering_joint_name: null
  # Frank's current configuration reports approximately 0.250 m. Keep the
  # measured gate false until this is confirmed on the current chassis.
  wheelbase_m: 0.250
  minimum_speed_for_kinematic_estimate_mps: 0.20

calibration:
  wheelbase_measured: false
  mass_measured: false
  steering_limits_measured: false
  steering_latency_measured: false
  speed_response_measured: false
  stopping_distance_measured: false

vehicle_limits:
  # The mechanical lead selected 2.0 m/s^2 as the experiment ceiling. The
  # captured active vesc.yaml must match this site value and may not exceed it.
  controller_max_acceleration_mps2: 2.0
  controller_min_steering_rad: -0.263
  controller_max_steering_rad: 0.313

expected_start_pose:
  x_m: REPLACE_WITH_CAPTURED_X
  y_m: REPLACE_WITH_CAPTURED_Y
  yaw_rad: REPLACE_WITH_CAPTURED_YAW

course:
  surveyed_clear_radius_m: REPLACE_WITH_MEASURED_CLEAR_RADIUS
  localization_system: cartographer_tf
  evaluation_ground_truth_system: none_onboard_cartographer_only

safety_bridge:
  joy_topic: /vesc/joy
  deadman_button_index: 5
  estop_button_index: 6
  publish_rate_hz: 20.0
  joy_stale_seconds: 0.25
  # Hold the deadman for this long before the runner arms, allowing the previous
  # zero-command safety override to expire in the mux.
  deadman_clearance_seconds: 1.0
  estop_latched: true

rosbag:
  format: rosbag1
  compression: none
