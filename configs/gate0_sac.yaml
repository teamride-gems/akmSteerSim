# Preregistered Gate 0 configuration for the direct steer-speed SAC baseline.
# Gate 0 is a functionality gate, not an action-space comparison.
policy: MlpPolicy
policy_kwargs:
  net_arch: [64, 64]
torch_num_threads: 1
seed: 0

# A preregistration pilot reached 100% completion on five fixed Sakhir starts
# and a held-out Austin start at 50k. The formal five-seed budget is therefore
# fixed at 50k before any formal seed is trained.
train_steps: 50000
eval_interval_steps: 25000
save_every_steps: 10000

learning_rate: 3.0e-4
batch_size: 256
buffer_size: 1000000
learning_starts: 1000
tau: 0.005
discount_half_life_seconds: 10.0

ent_coef: auto
target_entropy: auto
# One gradient update per four fresh policy transitions (UTD=0.25). This is
# fixed for every seed and keeps the five-seed gate computationally tractable.
train_freq: 4
gradient_steps: 1

train_track: Sakhir
validation_tracks:
  - Austin
  - BrandsHatch
test_tracks:
  - Budapest
  - Hockenheim

# Two starts per validation track are for checkpoint selection only. The final
# Gate 0 decision uses 50 fixed, arc-length-spaced Sakhir starts per seed.
n_eval_episodes: 2
report_train_track: false
selection_metric: completion_then_progress
early_stop_patience: null
early_stop_min_delta: 0.0
