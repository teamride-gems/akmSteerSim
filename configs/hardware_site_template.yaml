safety_bridge:
  joy_topic: /joy
  deadman_button_index: REPLACE_WITH_BUTTON_INDEX
  estop_button_index: REPLACE_WITH_BUTTON_INDEX
  publish_rate_hz: 20.0
  joy_stale_seconds: 0.25
