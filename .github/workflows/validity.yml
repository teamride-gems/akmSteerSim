name: validity

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install numpy==1.22.0 gymnasium==1.2.3 pyyaml
      - name: Run validity preflight
        run: python scripts/preflight.py --skip-f110
